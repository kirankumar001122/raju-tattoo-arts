# ===================================================================
# Raju Tattoo Arts Backend Configuration (Production Ready)
# ===================================================================

# Server Port (PaaS platforms like Render set ${PORT})
server.port=${PORT:8080}

# MySQL Database Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/raju_tattoo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Resend Email API Configuration (HTTPS API)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:Raju Tattoo Arts <onboarding@resend.dev>}

# JWT Secret Key Configuration
app.jwt.secret=${JWT_SECRET:RajuTattooArtsSecretKeyForJwtAuthentication32BytesMinLengthRequired!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrator Master Credentials
app.admin.email=${ADMIN_EMAIL:darshantejomaya@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Darshan@2003}

# Razorpay Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.key-id=${razorpay.key.id}
app.razorpay.key-secret=${razorpay.key.secret}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
