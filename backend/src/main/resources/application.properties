# ===================================================================
# Raju Tattoo Arts Backend Configuration (Production Ready)
# ===================================================================

# Server Port (PaaS platforms like Render set ${PORT})
server.port=${PORT:8080}

# MySQL Database Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/raju_tattoo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring Mail SMTP Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:rajutattoadda@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Secret Key Configuration
app.jwt.secret=${JWT_SECRET:RajuTattooArtsSecretKeyForJwtAuthentication32BytesMinLengthRequired!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrator Master Credentials
app.admin.email=${ADMIN_EMAIL:darshantejomaya@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Darshan@2003}

# Razorpay Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.key-id=${razorpay.key.id}
app.razorpay.key-secret=${razorpay.key.secret}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
